        <span class="pop">뒤질 뻔한 게 한두 번이 아닙니다.</span></h1><div><span class="pop"><br></span></div><div><span class="pop"><br></span></div><h1><span class="pop"><span style="color: rgb(255, 255, 255); letter-spacing: -0.01em;">위험한 걸 누가 몰라요?&nbsp;</span>이렇게 할 수 밖에 없는 그지같은 시스템에 분노가 치밀어 오를 뿐입니다.</span></h1><div><br></div><div><br></div><h1>그리고 그걸 알면서도 내일 다시 해야 한다는 사실이 개 빡쳐서 다 뜯어 고치기로 마음을 먹었습니다.</h1>

  <!-- MANIFESTO (원문 보존) -->

          const sel = window.getSelection();
          if (sel && sel.rangeCount && !sel.isCollapsed) {
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = '1.3em';
            try { range.surroundContents(span); } catch (_) {}
          }
          break;
        }
        case 'size-down': {
          const sel = window.getSelection();
          if (sel && sel.rangeCount && !sel.isCollapsed) {
            const range = sel.getRangeAt(0);
            const span = document.createElement('span');
            span.style.fontSize = '0.85em';
            try { range.surroundContents(span); } catch (_) {}
          }
          break;
        }
        case 'color-red': exec('foreColor', '#ff3b30'); break;
        case 'color-yellow': exec('foreColor', '#ffd60a'); break;
        case 'color-blue': exec('foreColor', '#4da3ff'); break;
        case 'color-dim': exec('foreColor', '#9a9a9a'); break;
        case 'align-left': exec('justifyLeft'); break;
        case 'align-center': exec('justifyCenter'); break;
        case 'align-right': exec('justifyRight'); break;
        case 'ul': exec('insertUnorderedList'); break;
        case 'ol': exec('insertOrderedList'); break;
        case 'quote': exec('formatBlock', 'blockquote'); break;
        case 'br': exec('insertHTML', '<br>'); break;
        case 'hr': exec('insertHorizontalRule'); break;
        case 'link': {
          const url = prompt('링크 URL:', 'https://');
          if (url) exec('createLink', url);
          break;
        }
        case 'undo': exec('undo'); break;
        case 'redo': exec('redo'); break;
      }
    });
  }
  function showToolbar() {
    document.getElementById('edit-toolbar')?.classList.add('show');
    document.body.classList.add('editing-mode');
  }
  function hideToolbar() {
    document.getElementById('edit-toolbar')?.classList.remove('show');
    document.body.classList.remove('editing-mode');
    _activeBox = null;
  }

  function enterEdit(box) {
    if (box.classList.contains('editing')) return;
    // 다른 박스 editing 중이면 취소
    if (_activeBox && _activeBox !== box) cancelEdit(_activeBox);
    const content = box.querySelector(':scope > .box-content');
    box._snapshot = content.innerHTML;
    content.contentEditable = 'true';
    box.classList.add('editing');
    _activeBox = box;
    showToolbar();
    content.focus();
  }

  function cancelEdit(box) {
    const content = box.querySelector(':scope > .box-content');
    if (box._snapshot != null) content.innerHTML = box._snapshot;
    content.contentEditable = 'false';
    box.classList.remove('editing');
    box._snapshot = null;
    hideToolbar();
  }

  async function saveEdit(box) {
    flash('저장 중...');
    const content = box.querySelector(':scope > .box-content');
    const boxId = box.dataset.box;
    if (!boxId) { flash('data-box 없음', 'error'); return; }

    const saveBtn = box.querySelector('.edit-actions .save');
    if (saveBtn) saveBtn.disabled = true;

    try {
      await ensureOwner();
      const html = content.innerHTML;
      await db.ref(`landing/boxes/${boxId}`).set({
        html: html,
        updatedAt: firebase.database.ServerValue.TIMESTAMP,
        updatedBy: auth.currentUser.email
      });
      content.contentEditable = 'false';
      box.classList.remove('editing');
      box._snapshot = null;
      flash('저장 완료 ✓', 'ok');
      hideToolbar();
    } catch (e) {
      console.error('[QP edit] save fail', e);
      flash('저장 실패: ' + e.message, 'error');
      content.contentEditable = 'true';
      box.classList.add('editing');
      _activeBox = box;
    } finally {
      if (saveBtn) saveBtn.disabled = false;
    }
  }

  // init — RTDB 자료 먼저 로드 후 편집 버튼 부착
  loadFromRTDB().finally(() => {
    attachEditButtons();
    attachToolbar();
  });
})();
</script>
