    let authReadyResolve;
    const authReady = new Promise((resolve) => { authReadyResolve = resolve; });
    let authReadyDone = false;

    function setStatus(message, isEditing = false) {
      status.textContent = message;
      status.classList.toggle("editing", isEditing);
    }

    function markDirty() {
      hasUnsavedChanges = true;
      editRevision += 1;
      setStatus("수정 내용이 있습니다. 저장하세요.", true);
      scheduleAutoSave();
    }

    function draftRef(report) {
      return db.ref(`v1/report_editor_drafts/${report.id}`);
    }

    function notesRef(report) {
      return db.ref(`v1/report_editor_notes/${report.id}`);
    }

    function refreshControls() {
      const ready = Boolean(selected);
      saveButton.disabled = !ready;
      resetButton.disabled = !ready;
      editorBlocks.querySelectorAll("textarea").forEach((field) => { field.disabled = !ready; });
    }

    const visualSelector = ".hours, .rbar, .donut, .dtable, .stat, .vs, .metric, .bars, .omap, .hero, .cloud, .symbols, .chips";

    function isVisualRoot(element) {
      return element.matches(visualSelector)
        || (element.classList.contains("card")
          && element.querySelector(".bar, .hours, .rbar, .donut, .dtable, .stat, .vs, .metric, .bars, .omap, svg"));
    }

    function isEditableElement(element) {
      const tag = element.tagName.toLowerCase();
      return ["h1", "h2", "h3", "p", "li", "footer"].includes(tag)
        || element.classList.contains("kicker")
        || element.classList.contains("subhead");
    }

    function cleanReportTitle(title) {
      return String(title || "")
        .replace(/^QP\s+/, "")
        .replace(/^데이터 리포트\s+\d+호\s*·\s*/, "")
        .replace(/^특별분석\s*·\s*/, "")
        .replace(/^특별 분석\s*·\s*/, "")
        .replace(/^특별\s*·\s*/, "")
        .trim();
    }

    function appTitlePrefix(report) {
      if (!report) return "리포트";
      if (report.number === "특별") return "QP 특별분석";
      if (report.number === "초안") return "리포트 초안";
      return `데이터 리포트 ${report.number}`;
    }

    function appTitleFor(report, title) {
      return `${appTitlePrefix(report)} · ${cleanReportTitle(title)}`.trim();
    }

    function bodyTitleFromAppTitle(value) {
      const text = String(value || "").trim();
      const separator = text.indexOf(" · ");
      return separator >= 0 ? text.slice(separator + 3).trim() : text;
    }

    function collectEditableElements(document) {
      const elements = [];
      function walk(element) {
        if (isVisualRoot(element)) return;
        if (isEditableElement(element)) {
          elements.push(element);
          return;
        }
        for (const child of element.children) walk(child);
      }
      walk(document.body);
      return elements;
    }

    function plainText(element) {
      const clone = element.cloneNode(true);
      clone.querySelectorAll("br").forEach((br) => br.replaceWith("\n"));
      clone.querySelectorAll(".num").forEach((number) => number.remove());
      return clone.textContent.replace(/\r/g, "").trim();
    }

    function markdownPrefix(element) {
      const tag = element.tagName.toLowerCase();
      if (tag === "h1") return "# ";
      if (tag === "h2") return "## ";
      if (tag === "h3") return "### ";
      if (tag === "li") return "- ";
      return "";
    }

    function htmlToMarkdown(html) {
      const document = new DOMParser().parseFromString(html, "text/html");
      const lines = [];
      let visualNumber = 0;

      function walk(element) {
        if (isVisualRoot(element)) {
          visualNumber += 1;
          lines.push(`<!-- 시각화 자료 ${visualNumber}: 저장할 때 그대로 유지 -->`, "");
          return;
        }
        if (isEditableElement(element)) {
          const text = plainText(element).replace(/<!--/g, "&lt;!--");
          if (text) lines.push(markdownPrefix(element) + text, "");
          return;
        }
        for (const child of element.children) walk(child);
      }

      walk(document.body);
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
    }

    function parseMarkdown(markdown) {
      const blocks = [];
      let current = null;
      const flush = () => {
        if (!current) return;
        const text = current.lines.join("\n").trim();
        if (text) blocks.push({ type: current.type, text });
        current = null;
      };
      for (const rawLine of markdown.replace(/\r/g, "").split("\n")) {
        const line = rawLine.trimEnd();
        if (!line.trim() || line.trim().startsWith("<!--")) {
          flush();
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          flush();
          current = { type: `h${heading[1].length}`, lines: [heading[2]] };
          continue;
        }
        const item = line.match(/^[-*]\s+(.*)$/);
        if (item) {
          flush();
          blocks.push({ type: "li", text: item[1].trim() });
          continue;
        }
        if (!current) current = { type: "p", lines: [] };
        current.lines.push(line);
      }
      flush();
      return blocks;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;");
    }

    function inlineMarkdownToHtml(text) {
      return escapeHtml(text)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/\*([^*]+)\*/g, "<em>$1</em>")
        .replace(/  \n/g, "<br>")
        .replace(/\n/g, "<br>");
    }

    function setElementText(element, text) {
      const number = element.querySelector(":scope > .num");
      if (number) {
        const target = [...element.children].find((child) => child !== number);
        if (target) target.innerHTML = inlineMarkdownToHtml(text);
        return;
      }
      element.innerHTML = inlineMarkdownToHtml(text);
    }

    function applyMarkdownToHtml(html, markdown) {
      const document = new DOMParser().parseFromString(html, "text/html");
      const elements = collectEditableElements(document);
      const blocks = parseMarkdown(markdown);
      const count = Math.min(elements.length, blocks.length);
      for (let index = 0; index < count; index += 1) {
        setElementText(elements[index], blocks[index].text);
      }
      return {
        html: "<!doctype html>\n" + document.documentElement.outerHTML,
        expected: elements.length,
        received: blocks.length,
      };
    }

    function buildBlockModel(html) {
      const document = new DOMParser().parseFromString(html, "text/html");
      const blocks = [];
      let visualNumber = 0;
      let titleFound = false;

      function walk(element) {
        if (isVisualRoot(element)) {
          visualNumber += 1;
          const id = `visual-${String(visualNumber).padStart(2, "0")}`;
          element.dataset.editorVisualId = id;
          blocks.push({ kind: "visual", id });
          return;
        }
        if (isEditableElement(element)) {
          const text = plainText(element);
          if (text) {
            const isTitle = element.tagName.toLowerCase() === "h1" && !titleFound;
            if (isTitle) titleFound = true;
            blocks.push({
              kind: "text",
              value: isTitle ? appTitleFor(selected, text) : markdownPrefix(element) + text,
              role: isTitle ? "app-title" : "",
            });
          }
          return;
        }
        for (const child of element.children) walk(child);
      }

      walk(document.body);
      return {
        html: "<!doctype html>\n" + document.documentElement.outerHTML,
        blocks,
      };
    }

    function growTextarea(field) {
      field.style.height = "auto";
      field.style.height = `${Math.max(field.scrollHeight, 48)}px`;
    }

    function resizeEditorFields() {
      editorBlocks.querySelectorAll("textarea").forEach(growTextarea);
    }

    function isolateVisualFrame(iframe, visualId) {
      try {
        const document = iframe.contentDocument;
        const target = document.querySelector(`[data-editor-visual-id="${visualId}"]`);
        if (!target) return;
        document.body.querySelectorAll("*").forEach((element) => {
          if (element === target || target.contains(element) || element.contains(target)) return;
          element.style.display = "none";
        });
        document.querySelectorAll(".sheet, .wrap").forEach((element) => {
          element.style.minHeight = "0";
        });
        document.documentElement.style.overflow = "hidden";
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => {
          const bottom = target.getBoundingClientRect().bottom + 24;
          iframe.style.height = `${Math.max(100, Math.ceil(bottom))}px`;
        });
      } catch (error) {
        iframe.style.height = "120px";
      }
    }

    function renderBlocks(model, savedNotes = {}, savedAppTitle = "") {
      editorModel = model;
      notesByVisual = savedNotes && typeof savedNotes === "object" ? savedNotes : {};
      pageTitle.textContent = savedAppTitle || appTitleFor(selected, selected?.title);
      editorBlocks.replaceChildren();
      model.blocks.forEach((block) => {
        if (block.kind === "text") {
          const field = document.createElement("textarea");
          field.className = "text-block";
          field.spellcheck = false;
          field.value = block.role === "app-title" && savedAppTitle ? savedAppTitle : block.value;
          if (block.role) field.dataset.role = block.role;
          if (block.role === "app-title") {
            const label = document.createElement("div");
            label.className = "block-label";
            label.textContent = "앱 제목";
            field.setAttribute("aria-label", "앱 제목 수정");
            pageTitle.textContent = field.value.trim();
            editorBlocks.appendChild(label);
          }
          field.addEventListener("input", () => {
            growTextarea(field);
            if (field.dataset.role === "app-title") pageTitle.textContent = field.value.trim();
            markDirty();
          });
          editorBlocks.appendChild(field);
          growTextarea(field);
          return;
        }

        const visual = document.createElement("section");
        visual.className = "visual-block";
        const caption = document.createElement("div");
        caption.className = "visual-caption";
        caption.textContent = `시각화 ${block.id.replace("visual-", "")}`;
        const frame = document.createElement("iframe");
        frame.className = "visual-frame";
        frame.title = `${selected?.title || "리포트"} ${caption.textContent}`;
        frame.setAttribute("scrolling", "no");
        frame.setAttribute("sandbox", "allow-scripts allow-same-origin");
        frame.srcdoc = model.html;
        frame.addEventListener("load", () => isolateVisualFrame(frame, block.id));
        const note = document.createElement("textarea");
        note.className = "visual-note";
        note.dataset.visualId = block.id;
        note.placeholder = "이 시각화에 수정·변경 요청을 적으세요";
        note.value = notesByVisual[block.id]?.text || "";
        note.addEventListener("input", () => {
          growTextarea(note);
          markDirty();
        });
        visual.append(caption, frame, note);
        editorBlocks.appendChild(visual);
        growTextarea(note);
      });
      hasUnsavedChanges = false;
      refreshControls();
    }

    window.addEventListener("resize", () => requestAnimationFrame(resizeEditorFields));

    function collectNotes() {
      const notes = {};
      editorBlocks.querySelectorAll(".visual-note").forEach((field) => {
        const text = field.value.trim();
        if (text) notes[field.dataset.visualId] = { text };
      });
      return notes;
    }

    function collectTextMarkdown() {
      return [...editorBlocks.querySelectorAll(".text-block")]
        .map((field) => {
          const value = field.value.replace(/\r/g, "").trim();
          return field.dataset.role === "app-title" ? `# ${bodyTitleFromAppTitle(value)}` : value;
        })
        .filter(Boolean)
        .join("\n\n");
    }

    function collectAppTitle() {
      return editorBlocks.querySelector('.text-block[data-role="app-title"]')?.value.trim()
        || appTitleFor(selected, selected?.title);
    }

    function saveLocalDraft(html, notes, automatic, title = collectAppTitle()) {
      const htmlKey = automatic ? autoStorageKey(selected.id) : storageKey(selected.id);
      const noteKey = automatic ? autoNotesKey(selected.id) : notesKey(selected.id);
      const metaKey = automatic ? autoMetaKey(selected.id) : storageMetaKey(selected.id);
      const titleKey = automatic ? autoTitleKey(selected.id) : storageTitleKey(selected.id);
      localStorage.setItem(htmlKey, html);
      localStorage.setItem(noteKey, JSON.stringify(notes));
      localStorage.setItem(metaKey, String(Date.now()));
      localStorage.setItem(titleKey, title);
    }

    function clearLocalDraft(automatic) {
      const htmlKey = automatic ? autoStorageKey(selected.id) : storageKey(selected.id);
      const noteKey = automatic ? autoNotesKey(selected.id) : notesKey(selected.id);
      const metaKey = automatic ? autoMetaKey(selected.id) : storageMetaKey(selected.id);
      const titleKey = automatic ? autoTitleKey(selected.id) : storageTitleKey(selected.id);
      localStorage.removeItem(htmlKey);
      localStorage.removeItem(noteKey);
      localStorage.removeItem(metaKey);
      localStorage.removeItem(titleKey);
    }

    async function writeDraftToServer(html, notes, title) {
      if (!currentUser) return false;
      const actor = currentUser.email || currentUser.uid || "editor";
      const noteData = {};
      Object.entries(notes).forEach(([visualId, value]) => {
        noteData[visualId] = {
          text: value.text,
          updatedAt: firebase.database.ServerValue.TIMESTAMP,
          updatedBy: actor,
        };
      });
      await db.ref("v1").update({
        [`report_editor_drafts/${selected.id}`]: {
          title,
          html,
          updatedAt: firebase.database.ServerValue.TIMESTAMP,
          updatedBy: actor,
        },
        [`report_editor_notes/${selected.id}`]: noteData,
      });
      return true;
    }

    function buildAutoDraftLocally() {
      if (!selected || !sourceHtml || !hasUnsavedChanges) return false;
      const html = buildSavedHtml(true);
      if (!html) return false;
      saveLocalDraft(html, collectNotes(), true, collectAppTitle());
      return true;
    }

    async function autoSaveCurrentReport(revision) {
      if (!selected || !sourceHtml || !hasUnsavedChanges || revision !== editRevision) return;
      const html = buildSavedHtml(true);
      if (!html) return;
      const notes = collectNotes();
      const title = collectAppTitle();
      saveLocalDraft(html, notes, true, title);
      if (revision === editRevision) {
        hasUnsavedChanges = false;
        setStatus("자동 저장되었습니다. 이 기기에 보관했습니다.");
      }
      let serverSaved = false;
      if (currentUser && revision === editRevision) {
        try {
          serverSaved = await writeDraftToServer(html, notes, title);
        } catch (error) {
          serverSaved = false;
        }
      }
      if (revision !== editRevision) return;
      if (serverSaved) setStatus("자동 저장되었습니다.");
    }

    function scheduleAutoSave() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        autoSaveTimer = null;
        void autoSaveCurrentReport(editRevision);
      }, 900);
    }

    auth.onAuthStateChanged((user) => {
      currentUser = user || null;
      if (!authReadyDone) {
        authReadyDone = true;
        authReadyResolve(currentUser);
      }
      refreshControls();
    });

    async function ensureEditorSession() {
      await authReady;
      if (currentUser) return currentUser;
      try {
        await auth.signInAnonymously();
        return currentUser;
      } catch (error) {
        return null;
      }
    }

    function sourceFromUrl(url) {
      try {
        return new URL(url, location.href).pathname.replace(/^\/+/, "");
      } catch (error) {
        return "";
      }
    }

    async function syncPublishedReports() {
      const response = await fetch(`${firebaseConfig.databaseURL}/v1/reports.json?editor=${Date.now()}`, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const live = await response.json() || {};
      for (const [id, record] of Object.entries(live)) {
        if (!record || typeof record !== "object") continue;
        const source = sourceFromUrl(record.url);
        if (!source) continue;
        const existing = reports.find((report) => report.id === id);
        if (existing) {
          existing.title = record.title || existing.title;
          existing.source = source;
          existing.published = true;
          existing.status = "발행 완료";
        } else {
          reports.push({ id, number: id.match(/^col(\d+)$/)?.[1] ? `${id.match(/^col(\d+)$/)[1]}호` : "특별", title: record.title || id, source, status: "발행 완료", published: true });
        }
      }
    }

    async function loadReport(report) {
      selected = report;
      pageTitle.textContent = appTitleFor(report, report.title);
      clearTimeout(autoSaveTimer);
      autoSaveTimer = null;
      hasUnsavedChanges = false;
      refreshControls();
      setStatus("초안을 불러오는 중입니다.");
      try {
        let serverHtml = "";
        let serverTitle = "";
        let serverNotes = {};
        let serverUpdatedAt = 0;
        if (currentUser) {
          try {
            const snapshot = await draftRef(report).once("value");
            const record = snapshot.val() || {};
            serverHtml = record.html || "";
            serverTitle = record.title || "";
            serverUpdatedAt = Number(record.updatedAt) || 0;
          } catch (error) {
            serverHtml = "";
          }
          try {
            const snapshot = await notesRef(report).once("value");
            serverNotes = snapshot.val() || {};
          } catch (error) {
            serverNotes = {};
          }
        }
        const saved = localStorage.getItem(storageKey(report.id));
        const autoSaved = localStorage.getItem(autoStorageKey(report.id));
        const savedTitle = localStorage.getItem(storageTitleKey(report.id)) || "";
        const autoTitle = localStorage.getItem(autoTitleKey(report.id)) || "";
        const savedAt = Number(localStorage.getItem(storageMetaKey(report.id))) || 0;
        const autoSavedAt = Number(localStorage.getItem(autoMetaKey(report.id))) || 0;
        let localNotes = {};
        let autoNotes = {};
        try {
          localNotes = JSON.parse(localStorage.getItem(notesKey(report.id)) || "{}");
        } catch (error) {
          localNotes = {};
        }
        try {
          autoNotes = JSON.parse(localStorage.getItem(autoNotesKey(report.id)) || "{}");
        } catch (error) {
          autoNotes = {};
        }

        const serverIsNewest = serverHtml && serverUpdatedAt >= Math.max(savedAt, autoSavedAt);
        const autoIsNewest = autoSaved && autoSavedAt >= savedAt && autoSavedAt > serverUpdatedAt;
        let loadedTitle = appTitleFor(report, report.title);
        if (serverIsNewest) {
          sourceHtml = serverHtml;
          loadedTitle = serverTitle || loadedTitle;
          setStatus("서버에 저장된 수정본을 열었습니다.");
          notesByVisual = serverNotes;
        } else if (autoIsNewest) {
          sourceHtml = autoSaved;
          loadedTitle = autoTitle || loadedTitle;
          setStatus("자동 저장된 수정본을 열었습니다.");
          notesByVisual = autoNotes;
        } else if (saved) {
          sourceHtml = saved;
          loadedTitle = savedTitle || loadedTitle;
          setStatus("이 휴대폰에 저장한 수정본을 열었습니다.");
          notesByVisual = localNotes;
        } else if (serverHtml) {
          sourceHtml = serverHtml;
          loadedTitle = serverTitle || loadedTitle;
          setStatus("서버에 저장된 수정본을 열었습니다.");
          notesByVisual = serverNotes;
        } else {
          sourceHtml = window.REPORT_DRAFTS[report.source] || "";
          if (!sourceHtml) {
            const response = await fetch(report.source, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            sourceHtml = await response.text();
          }
          setStatus("원본 초안을 열었습니다.");
          notesByVisual = {};
        }
        const model = buildBlockModel(sourceHtml);
        renderBlocks(model, notesByVisual, loadedTitle);
        refreshControls();
      } catch (error) {
        sourceHtml = "";
        editorModel = null;
        notesByVisual = {};
        editorBlocks.replaceChildren();
        setStatus("초안을 불러오지 못했습니다. 새로고침해 주세요.");
      }
    }

    function buildSavedHtml(silent = false) {
      if (!selected || !sourceHtml) return "";
      const result = applyMarkdownToHtml(sourceHtml, collectTextMarkdown());
      const structureMessage = result.expected === result.received
        ? "마크다운 내용을 저장할 수 있습니다."
        : `제목·문단 수가 원본과 다릅니다. 반영 ${Math.min(result.expected, result.received)}개 / 원본 ${result.expected}개`;
      if (!silent) setStatus(structureMessage, result.expected !== result.received);
      return result.html;
    }

    async function saveCurrentReport() {
      if (!selected) return false;
      const html = buildSavedHtml();
      if (!html) return false;
      const notes = collectNotes();
      const title = collectAppTitle();
      let serverSaved = false;
      try {
        saveLocalDraft(html, notes, false, title);
        serverSaved = await writeDraftToServer(html, notes, title);
        clearLocalDraft(true);
        sourceHtml = html;
      } catch (error) {
        try { saveLocalDraft(html, notes, false, title); } catch (localError) { /* keep the editor open */ }
        clearLocalDraft(true);
        sourceHtml = html;
      }
      hasUnsavedChanges = false;
      setStatus(serverSaved ? "서버에 저장했습니다. 아직 공개되지 않았습니다." : "서버 연결 없이 이 기기에 저장했습니다.");
      return true;
    }

    saveButton.addEventListener("click", saveCurrentReport);

    resetButton.addEventListener("click", async () => {
      if (!selected || !confirm("이 휴대폰에 저장한 수정본을 지우고 원본 초안으로 돌아갈까요?")) return;
      try {
        clearLocalDraft(false);
        clearLocalDraft(true);
        if (currentUser) {
          await draftRef(selected).remove();
          await notesRef(selected).remove();
        }
        await loadReport(selected);
        setStatus("저장한 수정본을 지우고 원본 초안을 다시 열었습니다.");
      } catch (error) {
        setStatus("저장본을 지우지 못했습니다.");
      }
    });

    function closeExitModal() {
      exitModal.hidden = true;
      pendingExit = null;
      exitSaveButton.disabled = false;
      exitDiscardButton.disabled = false;
      exitCancelButton.disabled = false;
    }

    function navigateAfterExit(exit) {
      if (!exit) return;
      exitInProgress = true;
      closeExitModal();
      if (exit.mode === "history") {
        history.go(exit.steps);
      } else {
        location.href = exit.href;
      }
    }

    function requestExit(exit) {
      if (exitInProgress) return;
      if (!hasUnsavedChanges) {
        navigateAfterExit(exit);
        return;
      }
      pendingExit = exit;
      exitModal.hidden = false;
      exitCancelButton.focus();
    }

    backLink.addEventListener("click", (event) => {
      event.preventDefault();
      requestExit({ mode: "location", href: backLink.href });
    });

    exitCancelButton.addEventListener("click", closeExitModal);

    exitDiscardButton.addEventListener("click", () => {
      const exit = pendingExit;
      if (selected) clearLocalDraft(true);
      hasUnsavedChanges = false;
      navigateAfterExit(exit);
    });

    exitSaveButton.addEventListener("click", async () => {
      const exit = pendingExit;
      if (!exit) return;
      exitSaveButton.disabled = true;
      exitDiscardButton.disabled = true;
      exitCancelButton.disabled = true;
      setStatus("저장하는 중입니다.");
      const saved = await saveCurrentReport();
      if (saved) {
        navigateAfterExit(exit);
      } else {
        exitSaveButton.disabled = false;
        exitDiscardButton.disabled = false;
        exitCancelButton.disabled = false;
        setStatus("저장하지 못했습니다. 계속 편집할 수 있습니다.", true);
      }
    });

    exitModal.addEventListener("click", (event) => {
      if (event.target === exitModal) closeExitModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !exitModal.hidden) closeExitModal();
    });

    history.pushState({ reportEditorGuard: true }, "", location.href);
    window.addEventListener("popstate", () => {
      if (exitInProgress) return;
      if (!exitModal.hidden) {
        history.pushState({ reportEditorGuard: true }, "", location.href);
        return;
      }
      if (hasUnsavedChanges) {
        history.pushState({ reportEditorGuard: true }, "", location.href);
        requestExit({ mode: "history", steps: -2 });
        return;
      }
      exitInProgress = true;
      history.go(-1);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") buildAutoDraftLocally();
    });

    window.addEventListener("pagehide", buildAutoDraftLocally);

    window.addEventListener("beforeunload", (event) => {
      if (!hasUnsavedChanges || exitInProgress) return;
      event.preventDefault();
      event.returnValue = "";
    });

    (async () => {
      try {
        await syncPublishedReports();
      } catch (error) {
        setStatus("발행 목록 동기화에 실패했습니다. 저장된 초안을 먼저 확인합니다.");
      }
      const requestedId = new URLSearchParams(location.search).get("id") || "col6";
      const report = reports.find((item) => item.id === requestedId);
      if (!report) {
        setStatus("선택한 리포트를 찾지 못했습니다.");
        return;
      }
      await ensureEditorSession();
      await loadReport(report);
    })();
  </script>
</body>
</html>
